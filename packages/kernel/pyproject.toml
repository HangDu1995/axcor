[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-controller-kernel"
version = "1.0.0"
description = "Workflow Controller 内核：headless runner、Run 记账、事件账本、预算与门禁强制、插件 SDK"
requires-python = ">=3.12"
license = "LicenseRef-CANN-2.0"
authors = [{ name = "Workflow Controller Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.9",
    "click>=8.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "jsonschema>=4.0",
    "mcp>=1.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.13,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8,<0.16",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "claude-agent-sdk>=0.1",
    "codespell>=2.4,<2.5",
]

[project.scripts]
workflow-controller = "workflow_controller.__main__:main"

[dependency-groups]
test = ["workflow-controller-plugin-fake-driver"]

[tool.uv.sources]
workflow-controller-plugin-fake-driver = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["workflow_controller*"]

[tool.setuptools.package-data]
"workflow_controller" = ["resources/*.json"]
"workflow_controller.core" = ["schemas/*.json"]
"workflow_controller.driver" = ["*.ts"]
