[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-controller-plugin-graph"
version = "0.1.0"
description = "graph-yaml@1 驱动与 RunDagPanel 面板：YAML 声明 DAG 的 run 编排"
requires-python = ">=3.12"
license = "LicenseRef-CANN-2.0"
authors = [{ name = "Workflow Controller Contributors" }]
dependencies = ["workflow-controller-kernel"]

[project.entry-points."workflow_controller.plugins"]
graph = "workflow_controller.plugins.graph.plugin:GraphPlugin"

[tool.uv.sources]
workflow-controller-kernel = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["workflow_controller*"]

[tool.setuptools.package-data]
"workflow_controller.plugins.graph" = ["config.yaml"]
